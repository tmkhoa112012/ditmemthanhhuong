<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xem ảnh</title>
<style>
  :root { --bg:#f5f5f7; --fg:#1d1d1f; --card:#fff; --accent:#2563eb; --muted:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --fg:#f2f2f2; --card:#1c1d20; --muted:#33353a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; }
  .box { background:var(--card); padding:24px; border-radius:16px; text-align:center;
         max-width:560px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,.12); }
  button { font-size:16px; padding:10px 20px; border:0; border-radius:8px; cursor:pointer; margin:6px; }
  .yes { background:var(--accent); color:#fff; }
  .no  { background:var(--muted); color:var(--fg); }
  #photo { display:none; max-width:100%; border-radius:12px; margin-top:16px; }
  #msg { margin-top:12px; }
</style>
</head>
<body>
  <div class="box">
    <h2>Xem ảnh</h2>
    <div id="ask">
      <p>Bạn có chắc muốn xem ảnh không?</p>
      <button class="yes" id="yes">Có, xem ảnh</button>
      <button class="no" id="no">Không</button>
    </div>
    <p id="msg"></p>
    <!-- Đổi đường dẫn bên dưới thành ảnh có sẵn trong repo của bạn -->
    <img id="photo" data-src="gay.jpg" alt="Ảnh trong repo">
  </div>

<script>
  const ask = document.getElementById('ask');
  const photo = document.getElementById('photo');
  const msg = document.getElementById('msg');

  document.getElementById('yes').onclick = () => {
    photo.src = photo.dataset.src;      // chỉ tải ảnh sau khi người dùng đồng ý
    photo.style.display = 'block';
    ask.style.display = 'none';
  };
  document.getElementById('no').onclick = () => {
    ask.style.display = 'none';
    msg.textContent = 'Bạn đã chọn không xem ảnh.';
  };
  photo.onerror = () => {
    photo.style.display = 'none';
    msg.textContent = 'Không tìm thấy ảnh. Hãy kiểm tra lại đường dẫn data-src.';
  };
</script>
</body>
</html>

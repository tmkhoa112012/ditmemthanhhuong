<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện Ảnh</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; }
    
    /* Màn hình chọn vai trò */
    #role-modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.96);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal-box {
      background: #1e293b; padding: 30px; border-radius: 16px;
      text-align: center; width: 90%; max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    .modal-box h2 { margin-top: 0; }
    .btn {
      padding: 12px 20px; border: none; border-radius: 8px; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px;
    }
    .btn-user { background: #3b82f6; color: white; }
    .btn-user:hover { background: #2563eb; }
    .btn-admin { background: #ef4444; color: white; }
    .btn-admin:hover { background: #dc2626; }
    input[type="password"], input[type="file"] {
      width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px;
    }

    /* Giao diện chính */
    header {
      background: #1e293b; padding: 15px 25px; display: flex;
      justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;
    }
    .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }
    
    /* Khu vực Admin */
    .admin-panel {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px; margin-bottom: 35px;
    }
    .upload-card {
      background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;
    }
    .upload-card h3 { margin-top: 0; font-size: 18px; }

    /* Lưới ảnh */
    .section-title { border-left: 4px solid #3b82f6; padding-left: 12px; margin: 30px 0 15px; }
    .section-title.secret { border-color: #ef4444; color: #fca5a5; }
    .gallery {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;
    }
    .img-card {
      position: relative; background: #1e293b; border-radius: 10px;
      overflow: hidden; aspect-ratio: 1 / 1; border: 1px solid #334155;
    }
    .img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .del-btn {
      position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9);
      color: white; border: none; border-radius: 6px; padding: 5px 10px; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Hộp thoại hỏi vai trò khi mới vào -->
  <div id="role-modal">
    <div class="modal-box" id="step-1">
      <h2>Bạn là ai?</h2>
      <p style="color:#94a3b8;">Chọn chế độ truy cập thư viện ảnh</p>
      <button class="btn btn-user" onclick="enterUserMode()">👤 Tôi là User</button>
      <button class="btn btn-admin" onclick="showAdminLogin()">🔑 Tôi là Admin</button>
    </div>

    <div class="modal-box hidden" id="step-2">
      <h2>Xác thực Admin</h2>
      <input type="password" id="admin-pass" placeholder="Nhập mật khẩu Admin...">
      <button class="btn btn-admin" onclick="verifyAdmin()">Đăng nhập</button>
      <button class="btn" style="background:#334155;color:#cbd5e1;" onclick="backToStep1()">Quay lại</button>
      <p id="error-msg" style="color:#f87171; font-size:14px; margin-top:10px;"></p>
    </div>
  </div>

  <!-- Thanh điều hướng -->
  <header>
    <strong id="mode-badge">Chế độ: Đang chờ...</strong>
    <button class="btn" style="width:auto; margin:0; padding:8px 14px; background:#334155; color:white;" onclick="location.reload()">Đổi chế độ</button>
  </header>

  <div class="container">
    <!-- Bảng điều khiển chỉ hiện khi là Admin -->
    <div id="admin-controls" class="admin-panel hidden">
      <div class="upload-card">
        <h3 style="color:#60a5fa;">1. Đăng ảnh cho User (Công khai)</h3>
        <input type="file" id="file-user" accept="image/*">
        <button class="btn btn-user" onclick="uploadImage('user')">Tải lên mục User</button>
      </div>
      <div class="upload-card">
        <h3 style="color:#f87171;">2. Đăng ảnh cho Admin (Ảnh ẩn)</h3>
        <input type="file" id="file-admin" accept="image/*">
        <button class="btn btn-admin" onclick="uploadImage('admin')">Tải lên mục Ẩn</button>
      </div>
    </div>

    <!-- Khu vực ảnh ẩn (Chỉ Admin mới thấy) -->
    <div id="admin-gallery-section" class="hidden">
      <h2 class="section-title secret">🔒 Kho Ảnh Ẩn (Chỉ Admin xem được)</h2>
      <div id="admin-gallery" class="gallery"></div>
    </div>

    <!-- Khu vực ảnh công khai (User và Admin đều thấy) -->
    <h2 class="section-title">🖼️ Thư Viện Ảnh Công Khai</h2>
    <div id="user-gallery" class="gallery"></div>
  </div>

  <script>
    let adminPassword = '';

    function showAdminLogin() {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');
      document.getElementById('admin-pass').focus();
    }

    function backToStep1() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
      document.getElementById('error-msg').innerText = '';
    }

    // Chế độ User
    function enterUserMode() {
      document.getElementById('role-modal').classList.add('hidden');
      document.getElementById('mode-badge').innerText = '👤 Chế độ: USER';
      loadUserImages();
    }

    // Kiểm tra mật khẩu Admin
    async function verifyAdmin() {
      const pass = document.getElementById('admin-pass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });

      if (res.ok) {
        adminPassword = pass;
        document.getElementById('role-modal').classList.add('hidden');
        document.getElementById('mode-badge').innerText = '🔑 Chế độ: ADMIN';
        document.getElementById('admin-controls').classList.remove('hidden');
        document.getElementById('admin-gallery-section').classList.remove('hidden');
        loadUserImages();
        loadAdminImages();
      } else {
        document.getElementById('error-msg').innerText = 'Sai mật khẩu! Vui lòng thử lại.';
      }
    }

    // Tải danh sách ảnh User
    async function loadUserImages() {
      const res = await fetch('/api/images/user');
      const images = await res.json();
      renderGallery('user-gallery', images, 'user');
    }

    // Tải danh sách ảnh Admin
    async function loadAdminImages() {
      const res = await fetch('/api/images/admin', {
        headers: { 'x-admin-pass': adminPassword }
      });
      const images = await res.json();
      renderGallery('admin-gallery', images, 'admin');
    }

    // Hiển thị ảnh ra giao diện
    function renderGallery(elementId, images, type) {
      const container = document.getElementById(elementId);
      container.innerHTML = images.length === 0 ? '<p style="color:#64748b;">Chưa có ảnh nào.</p>' : '';
      images.forEach(src => {
        const cleanName = src.split('?')[0].split('/').pop();
        const delBtn = adminPassword 
          ? `<button class="del-btn" onclick="deleteImage('${type}', '${cleanName}')">Xóa</button>` 
          : '';
        container.innerHTML += `
          <div class="img-card">
            <img src="${src}" loading="lazy">
            ${delBtn}
          </div>`;
      });
    }

    // Upload ảnh
    async function uploadImage(type) {
      const input = document.getElementById(type === 'admin' ? 'file-admin' : 'file-user');
      if (!input.files[0]) return alert('Vui lòng chọn một file ảnh!');

      const formData = new FormData();
      formData.append('image', input.files[0]);

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: {
          'x-admin-pass': adminPassword,
          'x-upload-type': type
        },
        body: formData
      });

      if (res.ok) {
        input.value = '';
        type === 'admin' ? loadAdminImages() : loadUserImages();
      } else {
        alert('Lỗi khi tải ảnh lên!');
      }
    }

    // Xóa ảnh
    async function deleteImage(type, filename) {
      if (!confirm('Xóa ảnh này?')) return;
      await fetch('/api/delete', {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json',
          'x-admin-pass': adminPassword
        },
        body: JSON.stringify({ type, filename })
      });
      type === 'admin' ? loadAdminImages() : loadUserImages();
    }
  </script>
</body>
</html>

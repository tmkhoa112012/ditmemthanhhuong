<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ảnh</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d2129;--muted:#6b7280;--pri:#3b82f6;--danger:#ef4444;--line:#e5e7eb}
  :root{color-scheme:light}
  *{box-sizing:border-box}
  html{background:#f4f5f7;color-scheme:only light}
  body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 16px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:15px;cursor:pointer}
  .tabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  input[type=text],input[type=password],input[type=file]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);margin:6px 0;font-size:15px}
  .btn{padding:10px 16px;border:0;border-radius:8px;background:var(--pri);color:#fff;font-size:15px;cursor:pointer}
  .btn.danger{background:var(--danger)} .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .item img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in}
  .item .info{padding:8px 10px;font-size:13px}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;margin-bottom:4px}
  .badge.pub{background:#dcfce7;color:#166534} .badge.adm{background:#fee2e2;color:#991b1b}
  .muted{color:var(--muted);font-size:13px} .err{color:var(--danger);font-size:14px;min-height:20px}
  .hidden{display:none !important}
  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:9}
  #viewer img{max-width:95%;max-height:95%}
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Đăng ảnh</h1>
  <div class="tabs">
    <button id="tabUser" class="active">Chế độ User</button>
    <button id="tabAdmin">Chế độ Admin</button>
  </div>

  <!-- Đăng nhập admin -->
  <div id="loginBox" class="card hidden">
    <b>Đăng nhập Admin</b>
    <input type="password" id="pw" placeholder="Nhập mật khẩu admin">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn">Đăng nhập</button>
  </div>

  <!-- Form đăng ảnh -->
  <div id="uploadBox" class="card">
    <div class="row"><b id="uploadTitle">Đăng ảnh (công khai)</b><button class="btn ghost hidden" id="logoutBtn">Đăng xuất admin</button></div>
    <p class="muted" id="uploadHint">Ảnh đăng ở đây sẽ được cả User và Admin xem.</p>
    <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp">
    <input type="text" id="caption" placeholder="Chú thích (không bắt buộc)" maxlength="200">
    <div class="err" id="upErr"></div>
    <button class="btn" id="upBtn">Đăng ảnh</button>
  </div>

  <div class="muted" id="galleryTitle" style="margin-bottom:8px"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="viewer" class="hidden"><img id="viewerImg" alt=""></div>

<script>
let mode = 'user';      // 'user' | 'admin'
let isAdmin = false;
const $ = (id) => document.getElementById(id);

async function api(url, opt) {
  const r = await fetch(url, opt);
  let data = {}; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error(data.error || 'Có lỗi xảy ra');
  return data;
}

async function init() {
  isAdmin = (await api('/api/me')).admin;
  render();
}

function setMode(m) {
  mode = m;
  render();
}

function render() {
  $('tabUser').classList.toggle('active', mode === 'user');
  $('tabAdmin').classList.toggle('active', mode === 'admin');
  const needLogin = mode === 'admin' && !isAdmin;
  $('loginBox').classList.toggle('hidden', !needLogin);
  $('uploadBox').classList.toggle('hidden', needLogin);
  $('logoutBtn').classList.toggle('hidden', !(mode === 'admin' && isAdmin));
  if (mode === 'admin') {
    $('uploadTitle').textContent = 'Đăng ảnh (chỉ Admin xem)';
    $('uploadHint').textContent = 'Ảnh đăng ở chế độ Admin chỉ mình Admin xem được.';
    $('galleryTitle').textContent = 'Tất cả ảnh (Admin thấy cả ảnh công khai và ảnh riêng)';
  } else {
    $('uploadTitle').textContent = 'Đăng ảnh (công khai)';
    $('uploadHint').textContent = 'Ảnh đăng ở đây sẽ được cả User và Admin xem.';
    $('galleryTitle').textContent = 'Ảnh công khai';
  }
  if (!needLogin) loadImages(); else $('grid').innerHTML = '';
}

async function loadImages() {
  const list = await api('/api/images' + (mode === 'admin' && isAdmin ? '?scope=admin' : ''));
  const grid = $('grid');
  grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div class="muted" style="grid-column:1/-1;text-align:center;padding:30px;font-size:16px">Hiện tại chưa có ảnh được đăng lên.</div>'; return; }
  for (const it of list) {
    const div = document.createElement('div'); div.className = 'item';
    const img = document.createElement('img');
    img.src = '/img/' + it.file; img.loading = 'lazy';
    img.onclick = () => { $('viewerImg').src = img.src; $('viewer').classList.remove('hidden'); };
    const info = document.createElement('div'); info.className = 'info';
    const badge = document.createElement('span');
    badge.className = 'badge ' + (it.visibility === 'admin' ? 'adm' : 'pub');
    badge.textContent = it.visibility === 'admin' ? 'Chỉ Admin' : 'Công khai';
    const cap = document.createElement('div'); cap.textContent = it.caption || '';
    const time = document.createElement('div'); time.className = 'muted';
    time.textContent = new Date(it.time).toLocaleString('vi-VN');
    info.append(badge, cap, time);
    if (isAdmin && mode === 'admin') {
      const del = document.createElement('button');
      del.className = 'btn danger'; del.style.marginTop = '6px'; del.textContent = 'Xóa';
      del.onclick = async () => {
        if (!confirm('Xóa ảnh này?')) return;
        try { await api('/api/images/' + it.id, { method: 'DELETE' }); loadImages(); } catch (e) { alert(e.message); }
      };
      info.append(del);
    }
    div.append(img, info);
    grid.append(div);
  }
}

$('tabUser').onclick = () => setMode('user');
$('tabAdmin').onclick = () => setMode('admin');
$('viewer').onclick = () => $('viewer').classList.add('hidden');

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try {
    await api('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) });
    isAdmin = true; $('pw').value = ''; render();
  } catch (e) { $('loginErr').textContent = e.message; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').onclick = async () => {
  await api('/api/logout', { method: 'POST' });
  isAdmin = false; mode = 'user'; render();
};

$('upBtn').onclick = async () => {
  $('upErr').textContent = '';
  const f = $('file').files[0];
  if (!f) { $('upErr').textContent = 'Hãy chọn một ảnh'; return; }
  const fd = new FormData();
  fd.append('mode', mode);
  fd.append('caption', $('caption').value);
  fd.append('image', f);
  $('upBtn').disabled = true;
  try {
    await api('/api/upload', { method: 'POST', body: fd });
    $('file').value = ''; $('caption').value = '';
    loadImages();
  } catch (e) { $('upErr').textContent = e.message; }
  $('upBtn').disabled = false;
};

init();
</script>
</body>
</html>
